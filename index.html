<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>777 Tower</title>
<style>
:root{--ink:#1c1c1c;--ink2:#2b2b2b;--bg:#fbfaf7;--card:#fff;--line:#ebe6dc;--line2:#f4f1ea;--text:#1c1c1c;--muted:#5c5850;
  --gold:#1c1c1c;--gold-d:#8c6d3f;--gold-soft:#f6f1e7;--ok:#2f6b4f;--bad:#a54a42;
  --serif:"PingFang SC",-apple-system,"Microsoft YaHei",sans-serif;--mono:"PingFang SC",-apple-system,"Microsoft YaHei",sans-serif}
*,*:before,*:after{border-radius:0}
button,input,select,textarea,.tag,.wrap,.pcard,.qcard,.qadd,.demo,.yes,.no,.qno,header a,header b em,.qa p.lead,.note{border-radius:6px !important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg) none;color:var(--text);font:14px/1.55 "PingFang SC",-apple-system,"Helvetica Neue","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
header{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);color:var(--ink);padding:0 28px;display:flex;align-items:center;gap:34px;height:80px;position:sticky;top:0;z-index:20}
.acct{margin-left:auto;position:relative;font-size:13.5px;color:var(--muted);padding:10px 0;cursor:default;white-space:nowrap}
.acct:hover #me{color:var(--ink)}
.acct-menu{display:none;position:absolute;right:0;top:100%;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.08);min-width:120px;z-index:30;border-radius:6px}
.acct:hover .acct-menu{display:block}
.acct-menu a{display:block;padding:9px 14px;color:var(--ink);cursor:pointer;border-radius:0}
.acct-menu a:hover{background:var(--gold-soft)}
.h1note{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
.dl{color:#8c6d3f;cursor:pointer;text-decoration:none}.dl:hover{opacity:.75}
.del{background:#fff;color:var(--bad);border:1px solid #ecd6d3;margin-top:22px}
header .logo{height:62px;width:auto;display:block;flex-shrink:0}
header b{font-size:17px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}
header b em{font-style:normal;background:var(--ink);color:#fff;padding:2px 7px;border-radius:6px;font-size:14px}
header nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
header nav::-webkit-scrollbar{display:none}
header a{color:var(--muted);cursor:pointer;padding:7px 13px;border-radius:8px;white-space:nowrap;font-size:14px;transition:all .15s}
header a:hover{color:var(--ink);background:var(--line2)}
header a.on{color:#8c6d3f;background:var(--gold-soft);font-weight:600}
main{padding:28px;max-width:1600px;margin:0 auto}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1,.faq-head h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em;color:var(--ink)}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.demo{background:#fff;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools .muted{font-size:12.5px}
input,select,textarea{-webkit-appearance:none;appearance:none;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold-d);box-shadow:0 0 0 3px rgba(140,109,63,.16)}
textarea{width:100%;min-height:60px}
select{padding-right:30px;background:#fff url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%276%27%3E%3Cpath d=%27M0 0l5 6 5-6z%27 fill=%27%23475569%27/%3E%3C/svg%3E") no-repeat right 11px center}
button{font:inherit;padding:9px 18px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#fff;cursor:pointer;font-weight:500;transition:opacity .15s}
button:hover{opacity:.88}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button.sm{padding:4px 12px;font-size:12px;border-radius:8px}
.muted{color:var(--muted)}

/* 主表 */
.wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 250px);box-shadow:0 1px 3px rgba(21,23,28,.03)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1500px}
th{background:#f7f4ee;color:#3a3630;font-weight:600;text-align:left;padding:10px 14px;white-space:nowrap;font-size:13.5px;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}
th+th{border-left:1px solid var(--line)}
td+td{border-left:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5;vertical-align:top;white-space:normal;word-break:break-word}
tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover td{background:#fcfaf5}
tbody tr:last-child td{border-bottom:0}
.c-no{width:56px;min-width:56px;text-align:center;color:var(--muted)}
#people th:nth-child(-n+2),#people td:nth-child(-n+2){position:sticky;background:#fff;z-index:1}
#people th:first-child,#people td:first-child{left:0}
#people th:nth-child(2),#people td:nth-child(2){left:56px;box-shadow:1px 0 0 var(--line)}
#people th:nth-child(-n+2){background:#f7f4ee;z-index:3}
#people tbody tr:hover td:nth-child(-n+2){background:#fcfaf5}
.c-name{min-width:96px}.c-reach{min-width:130px;white-space:nowrap}.c-grp{min-width:110px}.c-ch{min-width:120px;white-space:nowrap}.c-det{min-width:200px}
.c-con{min-width:120px;max-width:180px}.c-fund{min-width:110px;white-space:nowrap}.c-yn{min-width:64px;text-align:center}
.c-stage{min-width:130px;white-space:nowrap}.c-block{min-width:170px;max-width:230px}.c-next{min-width:140px;max-width:200px}.c-date{min-width:120px;white-space:nowrap}
.c-name b{font-weight:600;color:var(--ink)}
.c-yn{cursor:pointer}.c-yn:hover{background:var(--gold-soft) !important}
.yes,.no{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:13px;font-weight:700}
.yes{background:#f0f6f2;color:var(--ok);border:1px solid #d3e4da}.no{background:#f9f1f0;color:var(--bad);border:1px solid #ecd6d3}
.sub2{display:inline;color:#a39d90;font-size:12px;margin-left:6px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid}
.tag:before{content:"";width:6px;height:6px;border-radius:50% !important;background:currentColor}
.社群池{background:#f7f6f2;color:#5c5850;border-color:#e6e1d6}.EB-5潜客{background:#f6f1e7;color:#8c6d3f;border-color:#e6d9bf}.高意向客户{background:#1c1c1c;color:#e9d9b4;border-color:#1c1c1c}

/* 手机卡片 */
.cards{display:none;flex-direction:column;gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;box-shadow:0 1px 3px rgba(21,23,28,.03)}
.pcard-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard-name{font-size:17px;font-weight:600;color:var(--ink)}
.pcard-reach{color:var(--muted);font-size:14px;margin-top:2px}
.pcard-grid{display:grid;grid-template-columns:76px 1fr;gap:7px 10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px}
.pcard-grid div:nth-child(odd){color:var(--muted)}
.evnum{width:80px;padding:4px 8px;border-radius:6px}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--muted)}

/* 抽屉 */
.bg{position:fixed;inset:0;background:rgba(21,23,28,.35);display:none;z-index:30;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;padding:26px 28px;overflow:auto;display:none;box-shadow:-10px 0 40px rgba(21,23,28,.12);z-index:31}
.show{display:block}
h2{color:var(--ink);margin:0 0 8px;font-size:22px}
h3{color:var(--ink);font-size:13px;font-weight:600;letter-spacing:.08em;margin:24px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:14.5px}
.kv div:nth-child(odd){color:var(--muted)}
.tl{border-left:1px solid var(--line);margin-left:5px;padding-left:16px}
.tl div{margin-bottom:10px;position:relative;font-size:13.5px}
.tl div:before{content:"";position:absolute;left:-21px;top:7px;width:9px;height:9px;border-radius:50%;background:#d4d2cc}
.tl div.eb5:before{background:#b8975a}
.c-reach,.c-date{font-size:13.5px;color:#3a3630}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.form .full{grid-column:1/-1}
.note{font-size:13px;color:#6e5532;background:var(--gold-soft);border-radius:10px;padding:10px 12px;line-height:1.6}

/* 高频问题 */
.faq{max-width:900px;margin:0 auto}
.faq-head p{color:var(--muted);margin:6px 0 22px;font-size:14px}
.faq-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.faq-tools input{flex:1;min-width:200px}
.qsec{margin-bottom:32px}
.qsec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;color:var(--ink);font-weight:700;font-size:16px}
.qsec-h:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.qsec-h i{font-family:-apple-system,"PingFang SC",sans-serif;font-style:normal;font-weight:600;font-size:11.5px;color:var(--gold-d);background:var(--gold-soft);border-radius:10px;padding:1px 9px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;transition:box-shadow .2s,border-color .2s}
.qcard:hover{box-shadow:0 6px 18px rgba(21,23,28,.05)}
.qcard[open]{border-color:#e6d9bf;box-shadow:0 8px 24px rgba(21,23,28,.06)}
.qcard summary{list-style:none;display:flex;align-items:center;gap:14px;padding:17px 22px;cursor:pointer}
.qcard summary::-webkit-details-marker{display:none}
.qno{flex-shrink:0;width:24px;height:24px;background:var(--gold-soft);color:var(--gold-d);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.qt{flex:1;font-size:15px;font-weight:600;color:var(--ink);line-height:1.55}
.chev{flex-shrink:0;color:var(--gold);font-size:20px;transition:transform .2s;line-height:1}
.qcard[open] .chev{transform:rotate(90deg)}
.qa{padding:0 22px 18px 60px;color:#26282d;font-size:15px;line-height:1.75}
.qa p{margin:0 0 6px}
.qa p.lead{background:var(--gold-soft);border-left:3px solid #b8975a;padding:9px 13px;margin-bottom:10px;border-radius:0 8px 8px 0;color:var(--ink);font-weight:600}
.qadd{background:#fff;border:1px dashed #e0d2b5;border-radius:14px;padding:14px 20px;margin-bottom:40px}
.qadd summary{cursor:pointer;color:var(--ink);font-weight:600}

/* 手机 */
@media (max-width:760px){
  header{padding:0 14px;gap:14px;height:66px}
  header .logo{height:50px}
  header a{padding:6px 11px;font-size:13px}
  .acct{font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .h1note{display:block;margin:4px 0 0}
  main{padding:16px 14px}
  .pagehead h1,.faq-head h1{font-size:22px}
  .tools{gap:8px}
  .tools select{flex:1;min-width:0}
  .tools input{flex:1 1 100%}
  .tools button{flex:1 1 100%}
  .wrap.desk{display:none}
  .cards{display:flex}
  .drawer{width:100%;padding:20px 18px}
  .form{grid-template-columns:1fr}
  .kv{grid-template-columns:84px 1fr}
  .qcard summary{padding:14px 16px;gap:10px}
  .qa{padding:0 16px 16px}
  .qt{font-size:14.5px}
  .faq-tools select,.faq-tools button{flex:1}
}
#login[hidden],#login [hidden]{display:none!important}
</style>

async function login(){
  const email=val("le"); if(!email) return showLogin("请填邮箱");
  const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});

async function start(){

}

function group(p){
  if(p.groupSet) return p.groupSet;
  const a=actsOf(p.id).map(x=>x.a);
  if(consulted(p) || ["深度咨询","律师咨询","签约"].includes(p.stage)) return "高意向客户";
  if(a.some(x=>EB5_ACTS.includes(x))) return "EB-5潜客";
  return "社群池";
}
const yes=(p,a)=>actsOf(p.id).some(x=>x.a===a)?"是":"否";
const last=p=>actsOf(p.id).slice(-1)[0];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date().toISOString().slice(0,10);
const src=p=>p.channel;
const val=id=>(document.getElementById(id)||{}).value?.trim()||"";

function addAct(id){ D.acts.push({p:id,d:val("ad")||today,a:val("aa"),x:val("ax")}); save(); renderMain(); openP(id); }
function delP(id){

// ---------- 高频问题：内置问答（写在文件里，发给别人也能看到） ----------
const BASE_QS = [
{id:"Q1",cat:"身份/流程",q:"递交申请之后，会先拿到什么卡？大概多久可以拿到？",a:`会先拿到双卡，也就是Combo卡，主要是工卡和回美纸，这两个一般会一起拿到，大概是在递案之后6–9个月。

拿到工卡之后，你就可以像正常居民一样去找工作，不需要老板再给你sponsor了。尤其是现在在美国读书或者准备找工作的，这个其实解决了很大的就业问题。

回美纸拿到以后，出入境也会方便很多。所以境内递交的一个优势，就是你不需要一直等到绿卡下来，前面就可以先拿到工作和出入境相关的身份便利。`},
{id:"Q2",cat:"本金退出",q:"我的投资本金，是不是要等拿到绿卡之后才能退回？",a:`是，但具体什么时候能退，每个EB-5项目都不一样。

因为EB-5投资本质上就是投一个私募基金，很多项目是地产类私募基金。每个项目基金怎么写、底层怎么经营、投资逻辑是什么，其实都不一样。

比如投的资产类型，我们叫Asset Class。你投的是酒店、公寓还是写字楼，不同Asset Class本身的运营周期和退出时间就不一样。

所以从你拿Combo卡，到后面拿绿卡，再到最后本金退出，整个时间3–7年以上都有可能，没有一个所有项目统一的时间，主要还是看你具体投的是什么项目、这个项目本身怎么设计退出。`},
{id:"Q3",cat:"本金退出",q:"那能不能保证几年之内一定返还本金？",a:`这个没有办法保证一个固定的年份。

EB-5毕竟还是投资，不是说投进去以后一定第5年或者第7年就能把本金拿回来。每个项目的退出时间、运营情况和还款安排都不一样，所以具体什么时候返还，要看你投的项目本身。`},
{id:"Q5",cat:"本金退出",q:"那本金是以后根据大楼的租金一点点还给投资人吗？",a:`不是简单理解成收一笔租金，就给投资人退一部分本金。

像我们这栋大楼本身一直都在，当时买的时候也是全款现金买下来的，不是说拿EB-5的钱才去买这栋楼。`},
{id:"Q6",cat:"排期/时间",q:"EB-5里面说的“排期”到底是什么意思？",a:`排期简单来说就是排队。

如果现在没有排期，那就是你的申请批到以后，有名额就可以继续往下面走。但一旦出现排期，你前面的申请即使走到一定阶段了，也可能要等签证名额。

所以你可以理解成，本来这条队伍是正常往前走的，一旦排期以后，前面的人走得很慢，后面的人又一直排进来，整个队伍就会越来越长。

这也是为什么大家做EB-5的时候会特别关注有没有排期，因为它会直接影响你最后拿绿卡的时间。`},
{id:"Q8",cat:"排期/时间",q:"那递交之后到底多久能拿到绿卡？境内和境外的时间一样吗？",a:`不一样。

如果人在境外递，就要走领馆这条路径。前面的申请批下来以后，还要等领馆面试，面试完成以后再入境。

所以你在网上看到有些人说“最快几个月”，很多讲的是人在美国境内，而且当时没有排期的情况，不代表人在海外也可以几个月拿到绿卡。

你们现在人在美国，其实就要利用好这个优势。如果符合境内双递交的条件，可以在美国境内把I-485这些一起递上去，中间还可以先拿工卡和回美纸。

境外走领馆的话，整个流程通常会更长。到底是两三年还是三五年，没有办法给所有人一个统一时间，还是要看当时的排期、移民局审批和领馆进度。`},
{id:"Q9",cat:"排期/时间",q:"我朋友2015年投的EB-5，到2024年才拿到绿卡，为什么会这么慢？",a:`2015年做的是旧政，那时候还是50万美金，跟现在的EB-5其实已经不完全一样了。

当时中国投资人特别多，后来排期很严重，所以有一批老投资人真的等了非常久。我们也有认识的人是17年底投的，后面一样等了很多年。

2022年以后新法案出来，最低投资额从以前的50万变成现在的80万，同时也有新的签证类别和规则。

所以你朋友2015年的这个案例是真的有可能发生，但是不能直接拿老法案那批人的时间，去套现在新法案下面的申请时间。两个时期的情况不太一样。`},
{id:"Q10",cat:"身份/流程",q:"拿到Combo卡是什么意思？是不是代表我的资金来源已经审过了？",a:`不是。拿到Combo卡可以算是一个good sign，说明你的这些申请已经在正常往前走了，但不代表资金来源已经最终审完了。

境内双递交其实是几条申请同时在走。一个是I-526E，这是EB-5本身的申请；另外一个是I-485，是你在美国境内调整身份。同时还会递I-765工卡和I-131回美纸。

所以它们是并行走的，不是一定要先批完I-526E，才能去批你的工卡和回美纸。

我们有投资人是先拿到工卡、回美纸，再等I-526E；也有人的I-526E走得比较快。谁先批并不是完全固定的。

所以Combo卡下来，不代表“验资已经过了”，只能说明你工卡、回美纸这一部分已经批下来了，EB-5本身的I-526E还是继续往下审。`},
{id:"Q11",cat:"资金来源",q:"那移民局验证这80万资金来源，是在拿绿卡之前吗？",a:`对，这个是在前面就会审的。

I-526E里面很重要的一部分，就是审你的Source of Funds和Path of Funds，也就是这80万到底从哪里来的，以及这个钱最后是怎么一步一步进入EB-5项目的。

如果移民局对你的资金来源有疑问，在I-526E审批过程中就可能会给你发RFE，也就是Request for Evidence，让你再补材料。

其实收到RFE不代表马上就被拒了，至少你还有机会继续提供证据，把之前没有解释清楚的地方补上，让移民局相信你的资金是合规合法的。

但是如果RFE以后提供的材料还是not convincing enough，那确实也有可能被拒。我们Downtown LA之前就有投资人遇到过这种情况，补了材料以后移民局还是觉得解释得不够，最后申请被拒了。

所以资金来源这一块真的很重要，不是等绿卡快批了才来看，而是在I-526E阶段就会重点审。`},
{id:"Q12",cat:"身份/流程",q:"整个EB-5拿绿卡的步骤到底是怎么样的？能不能从头到尾讲一下？",a:`EB-5里面会涉及几个比较重要的表格。

首先是I-526E，这是EB-5投资人本身的申请，里面很重要的一块就是审Source of Funds和Path of Funds，也就是这80万美金的资金来源和资金路径。

如果你人在美国境内，而且符合双递交条件，还可以同时递I-485。I-485是身份调整申请。跟它一起还会有I-131回美证和I-765工卡。

所以符合条件的话，这几个申请可以一起递上去，也就是大家经常说的境内双递交。

递上去以后，工卡和回美证通常会比较早下来。工卡下来以后，你就可以在美国合法工作，不需要再找老板给你sponsor；回美证下来以后，出入境也会方便很多。

但这个时候你还不是绿卡，你的I-526E和I-485都还会继续往下走。

I-526E主要是把EB-5这部分资格审完。I-526E批下来以后，还要看I-485。I-485也获批之后，你才真正拿到两年的临时绿卡，也就是有条件绿卡。

拿到临时绿卡以后，后面还有I-829。一般是在两年有条件绿卡到期前的规定时间内递I-829，把临时绿卡上面的条件解除掉。

I-829递交以后还会有一个审理期。如果审批时间比较长，你的永久居民身份证明也会按照移民局的规定延长，不是说两年绿卡卡片一到期，你的身份就突然没有了。

所以整个流程你可以简单理解成：

前期准备材料和资金方案 → 递I-526E；符合条件的境内申请人同时递I-485、I-765、I-131 → 先拿工卡/回美证 → I-526E继续审 → I-485获批以后拿两年临时绿卡 → 后面递I-829 → 最后解除条件，变成永久绿卡。

至于80万本金什么时候可以退，是另外一条项目退出的时间线。不是说哪一个移民表格一批，本金就自动退回来，还是要结合项目本身的投资期限和退出安排来看。`},
{id:"Q14",cat:"风险",q:"万一最后绿卡拿不到呢？一般会是什么原因？",a:`绿卡拿不拿得到，主要看两个原因。第一，10个就业有没有fulfill这个要求；第二，就是你这80万的资金来源。

像你们这种情况，我相信大部分都是爸爸妈妈的钱。移民局对申请人本身其实没有太多要求，不看你的学历、成绩这些，但是对这80万美金的资金来源审查是最严格的。所以一个是项目端的就业创造，一个是投资人端的资金来源，这两块都很重要。`},
{id:"Q15",cat:"风险",q:"EB-5最近不是有很多项目爆雷吗？比如万豪之类的？",a:`其实挺多的，绿地啊，包括Davis Center隔壁的一栋高楼，市场上确实有不少这种情况。

所以EB-5这个东西确实要小心，水挺深的，项目一定要好好看，不能随便投。有朋友介绍、或者对项目方和项目本身比较了解，会相对好一点。`},
{id:"Q17",cat:"就业创造",q:"酒店翻新或者建设类EB-5项目，是不是先由经济学家测算能创造多少就业，再根据就业数量决定可以募集多少投资人？",a:`对，是这样的。项目首先会有经济学分析报告，根据建筑预算去测算整个项目大概能够创造多少就业。

EB-5的要求是一个投资人至少对应10个就业，但是实际做项目的时候一定要留cushion。不能说经济学报告算出来项目能创造100个就业，你就刚好募10个投资人的份额，这样太危险了。

实际肯定要留出余量。比如按照项目整体就业创造能力去设计募集规模的时候，我们不会把就业额度卡得特别满，要给后面可能发生的变化留出空间。

就业创造本身又分直接就业、间接就业和衍生就业。我们的模式相对比较保守，主要看建筑产生的就业。这样项目盖完之后，相应的就业创造基本就已经完成了，不需要再等酒店后期运营慢慢去凑人数。

比如疫情期间，很多酒店都在裁员。如果一个项目特别依赖后期运营，需要靠酒店开业以后慢慢把就业人数凑够，那一旦运营出现问题，投资人的绿卡就可能受到影响。

我们这种方式不依赖后期的运营数据，主要通过建筑投入来创造就业。项目建设完成之后，就业要求也相应完成。这样后面酒店运营得好还是不好，至少不会完全依赖运营期员工数量去满足就业要求，对投资人来说会更稳一些。`},
{id:"Q20",cat:"资金来源",q:"资金来源一般需要提供哪些材料？",a:`律师会帮你做trace of the fund，就是把这80万到底是怎么来的，一层一层梳理清楚。

大部分中国投资人的资金来源，比较常见的是买卖房产或者公司经营积累下来的第一桶金。比如十年前开公司赚了第一桶金，后来拿这个钱买了某个城市的房产，十年以后房子涨价了，卖掉以后有了这80万美金的投资款。

但移民局要追的不只是“这80万是卖房来的”这么简单，它还会继续往前追：当年买这套房子的本金又是从哪里来的？有些人的资金来源甚至会一直追到20年前的工作积蓄。

这个其实很重要，因为中国过去很多年的税务、收入证明这些材料，没有现在这么完善，时间一久，有些材料找起来就会比较麻烦。

所以到时候我们这边会安排文案团队，协助你们爸爸妈妈把整个资金方案理顺，同时按照美国移民局的要求去准备。

你们也会请一个EB-5律师帮你们递案。律师需要向移民局解释清楚，这80万到底是怎么一步一步来的。但是中国投资人比较容易遇到的问题，就是年代太久，很多事情当年有，但是现在材料找不到了，或者整个链条解释不清楚。

所以我们中国这边的文案团队，会结合中国实际的情况和移民局的法律要求，帮你把中间这个gap补上，把整个资金路径整理完整。

中国投资人确实有因为资金来源最后解释不清楚而被拒的案例，所以这一块前期一定要认真准备。`},
{id:"Q21",cat:"资金来源",q:"资金来源的审查是在整个EB-5流程的哪一步？",a:`EB-5其实很大一部分的审查都在资金方案上。

它对申请人本人的学历、学校、成绩、工作背景这些基本没有要求，不是说你一定要什么学历或者做到什么职位才能申请。

真正比较重要的一块就是这80万的资金方案：钱从哪里来、怎么来的、整个资金路径能不能解释清楚。所以前期律师和文案团队花很多时间，其实都是在准备这一部分。`},
{id:"Q22",cat:"资金来源",q:"资金方案是在正式递交申请以后再准备吗？还是递交之前就要做好？",a:`不是，递案之前就要做好。

在filing pack正式交到移民局之前，前面一般会有大概6–8周的准备时间。这段时间主要就是律师和你们家里对接，把整个资金方案做出来。

比如这80万是爸爸妈妈提供的，那律师就需要跟爸爸妈妈对接。中间可能需要去房产局、税局或者其他相关部门把以前的档案调出来，把能够证明资金来源的各种proof准备好。

这些材料收集完以后，还要整理、翻译，再把整个资金来源和资金路径串起来，最后形成完整的资金方案。

所以不是先把80万投进去、把申请交了以后，再慢慢解释钱从哪里来的。资金来源这部分本身就是前期filing pack的重要组成部分，需要在正式递案之前准备好。`},
];
const QCATS=["资金来源","排期/时间","身份/流程","本金退出","就业创造","风险","子女年龄","项目情况","费用","其他"];
let QF="", QS="";
function renderQ(){
  D.qs=D.qs||[];
  const all=[...BASE_QS, ...D.qs.map((x,i)=>({...x,id:"N"+(i+1)}))];
  const cats=QCATS.filter(c=>all.some(x=>x.cat===c));
  const hit=x=>(!QF||x.cat===QF)&&(!QS||(x.q+x.a).includes(QS));
  const paras=t=>t.split(/\n\s*\n/).map((p,i)=>`<p${i===0?' class="lead"':''}>${esc(p)}</p>`).join("");
  const sections=cats.map(c=>{const xs=all.filter(x=>x.cat===c&&hit(x)); if(!xs.length) return "";
    return `<section class="qsec"><div class="qsec-h"><span>${c}</span><i>${xs.length}</i></div>
      ${xs.map((x,i)=>`<details class="qcard"><summary><span class="qno">${i+1}</span><span class="qt">${esc(x.q)}</span><span class="chev">›</span></summary>
        <div class="qa">${x.a?paras(x.a):'<p class="muted">还没有统一回答口径</p>'}</div></details>`).join("")}</section>`}).join("");
  document.getElementById("main").innerHTML=`<div class="faq">
  <div class="faq-head"><h1>高频问题</h1><p>投资人最常问的问题和统一回答口径。点开问题查看完整回答，第一段是简短结论。</p></div>
  <div class="faq-tools">
    <select onchange="QF=this.value;renderQ()"><option value="">全部分类（${all.length}）</option>${cats.map(c=>`<option value="${c}" ${QF===c?"selected":""}>${c}（${all.filter(x=>x.cat===c).length}）</option>`).join("")}</select>
    <input placeholder="搜索问题或回答里的关键词" value="${esc(QS)}" onchange="QS=this.value;renderQ()">
    <button class="ghost" onclick="document.querySelectorAll('.qcard').forEach(d=>d.open=!d.open)">全部展开 / 收起</button>
  </div>
  ${sections||'<p class="muted" style="text-align:center;padding:30px">没有符合条件的问题</p>'}
  <details class="qadd"><summary>＋ 新增问题</summary>
    <div class="form" style="margin-top:12px"><label class="full">问题<input id="qq" placeholder="尽量用对方的原话"></label>
    <label>分类<select id="qc">${QCATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
    <label class="full">统一回答口径（可不填）<textarea id="qa" style="min-height:110px"></textarea></label></div>
    <button onclick="if(val('qq')){D.qs.push({q:val('qq'),cat:val('qc'),a:val('qa')});save();renderQ()}">添加</button>
    <p class="muted" style="font-size:12px;margin:8px 0 0">新增的问题所有同事都能看到。</p></details>
  </div>`;
}

// ---------- 通用 ----------
function tab(t){ CUR=t; ["main","ev","q"].forEach(k=>document.getElementById("t-"+k).className=k===t?"on":""); ({main:renderMain,ev:renderEv,q:renderQ})[t](); }
function drawer(h){ const d=document.getElementById("dr"); d.innerHTML=h; d.classList.add("show"); document.getElementById("bg").classList.add("show"); }
function closeD(){ document.getElementById("dr").classList.remove("show"); document.getElementById("bg").classList.remove("show"); }
sb.auth.getSession().then(({data})=>data.session?start():showLogin());
</script>
